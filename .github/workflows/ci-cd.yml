name: CI/CD
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      - name: Check generated contexts
        run: |
          docker run --rm -v "$PWD:/app" fireworkweb/fwd:v1.0 fwd template
          git diff --exit-code
      - id: tags
        run: echo "tags=$(jq -c '[.builds[].name]' fwd-template.json)" >> "$GITHUB_OUTPUT"
  build:
    needs: checks
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
        version: ["8.2", "8.3", "8.4", "8.5"]
        distro: ["", "-debian"]
        type: ["", "-prod"]
        exclude:
          - {version: "8.2", distro: "-debian"}
          - {version: "8.3", distro: "-debian"}
    env:
      BASE: ${{ matrix.version }}${{ matrix.distro }}${{ matrix.type }}
      NGINX: ${{ matrix.version }}${{ matrix.distro }}-nginx${{ matrix.type }}
      NODE: ${{ matrix.version }}-node
      ARCH: ${{ matrix.platform.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: kool-dev/action/image-build@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        with:
          arch: ${{ env.ARCH }}
      - name: Build fresh base
        id: base
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BASE }}
          platforms: linux/${{ env.ARCH }}
          pull: true
          provenance: false
          load: true
          tags: kooldev/php:${{ env.BASE }}
      - name: Test base
        env:
          IMAGE_ID: ${{ steps.base.outputs.imageid }}
        run: bash scripts/test-image.sh "$BASE" "$IMAGE_ID"
      - name: Build nginx from same-job base (never force-pull)
        id: nginx
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.NGINX }}
          platforms: linux/${{ env.ARCH }}
          provenance: false
          load: true
          tags: kooldev/php:${{ env.NGINX }}
      - uses: kool-dev/action/image-parent@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        with:
          base-ref: kooldev/php:${{ env.BASE }}
          base-id: ${{ steps.base.outputs.imageid }}
          image-id: ${{ steps.nginx.outputs.imageid }}
      - name: Test nginx
        env:
          IMAGE_ID: ${{ steps.nginx.outputs.imageid }}
        run: bash scripts/test-image.sh "$NGINX" "$IMAGE_ID"
      - name: Build node from same-job base (never force-pull)
        id: node
        if: matrix.distro == '' && matrix.type == ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.NODE }}
          platforms: linux/${{ env.ARCH }}
          provenance: false
          load: true
          tags: kooldev/php:${{ env.NODE }}
      - uses: kool-dev/action/image-parent@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        if: matrix.distro == '' && matrix.type == ''
        with:
          base-ref: kooldev/php:${{ env.BASE }}
          base-id: ${{ steps.base.outputs.imageid }}
          image-id: ${{ steps.node.outputs.imageid }}
      - name: Test node
        if: matrix.distro == '' && matrix.type == ''
        env:
          IMAGE_ID: ${{ steps.node.outputs.imageid }}
        run: bash scripts/test-image.sh "$NODE" "$IMAGE_ID"
      - name: Collect tested IDs
        id: images
        env:
          BASE_ID: ${{ steps.base.outputs.imageid }}
          NGINX_ID: ${{ steps.nginx.outputs.imageid }}
          NODE_ID: ${{ steps.node.outputs.imageid }}
        run: |
          images=$(jq -cn --arg base "$BASE" --arg nginx "$NGINX" --arg node "$NODE" \
            --arg bid "$BASE_ID" --arg nid "$NGINX_ID" --arg oid "$NODE_ID" \
            '[{tag:$base,id:$bid},{tag:$nginx,id:$nid}] + if $oid == "" then [] else [{tag:$node,id:$oid}] end')
          echo "images=$images" >> "$GITHUB_OUTPUT"
      - uses: kool-dev/action/image-stage@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-php'
        with:
          canonical-repository: kool-dev/docker-php
          default-branch: master
          repository: kooldev/php
          arch: ${{ env.ARCH }}
          group: ${{ env.BASE }}
          images: ${{ steps.images.outputs.images }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  publish:
    needs: [checks, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-php'
    runs-on: ubuntu-24.04
    steps:
      - uses: kool-dev/action/image-publish@6a6d04e8d1e1c66afc178e32c7d77d76169c7717
        with:
          canonical-repository: kool-dev/docker-php
          default-branch: master
          repository: kooldev/php
          tags: ${{ needs.checks.outputs.tags }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
  trigger-downstream:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-php'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repo:
          - kool-dev/docker-wordpress
          - kool-dev/docker-php-sqlsrv
          - kool-dev/docker-php-swoole
    steps:
      - name: Notify downstream after complete publication
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.WORKFLOW_TOKEN }}
          REPOSITORY: ${{ matrix.repo }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Configure DISPATCH_TOKEN or WORKFLOW_TOKEN for downstream dispatch."
            exit 1
          fi
          gh api --method POST "repos/$REPOSITORY/dispatches" -f event_type=docker-php-updated
          echo "- $REPOSITORY: dispatch accepted (not downstream completion)." >> "$GITHUB_STEP_SUMMARY"
