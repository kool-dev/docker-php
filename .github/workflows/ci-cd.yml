name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a release between publishing base and derived images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test publication contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.11
      - name: Verify generated images match templates
        # fwd's packaged Blade cache is not writable by arbitrary user IDs.
        run: |
          docker run --rm -v "$PWD:/app" fireworkweb/fwd:v1.0 fwd template
          git diff --exit-code

  build-test:
    needs: checks
    runs-on: ${{ matrix.native.runner }}
    strategy:
      fail-fast: false
      matrix:
        native:
          - {arch: amd64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
        version: ["8.2", "8.3", "8.4", "8.5"]
        distro: ["", "-debian"]
        type: ["", "-prod"]
        exclude:
          - {version: "8.2", distro: "-debian"}
          - {version: "8.3", distro: "-debian"}
    env:
      BASE: ${{ matrix.version }}${{ matrix.distro }}${{ matrix.type }}
      NGINX: ${{ matrix.version }}${{ matrix.distro }}-nginx${{ matrix.type }}
      NODE: ${{ matrix.version }}-node
      ARCH: ${{ matrix.native.arch }}
    steps:
      - uses: actions/checkout@v7
      # The docker driver resolves derived FROMs to the fresh same-job base.
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Verify native architecture
        run: |
          case "$ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "::error::Not a native $ARCH runner"; exit 1 ;;
          esac
      - name: Build base image
        id: base
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.BASE }}
          platforms: linux/${{ env.ARCH }}
          pull: true
          load: true
          tags: kooldev/php:${{ env.BASE }}
      - name: Test base image
        env:
          IMAGE_ID: ${{ steps.base.outputs.imageid }}
        run: bash scripts/test-image.sh "$BASE" "$IMAGE_ID"
      - name: Build nginx image
        id: nginx
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.NGINX }}
          platforms: linux/${{ env.ARCH }}
          load: true
          tags: kooldev/php:${{ env.NGINX }}
      - name: Test nginx image
        env:
          IMAGE_ID: ${{ steps.nginx.outputs.imageid }}
          BASE_ID: ${{ steps.base.outputs.imageid }}
        run: |
          python3 scripts/check_parent.py "$BASE" "$BASE_ID" "$IMAGE_ID"
          bash scripts/test-image.sh "$NGINX" "$IMAGE_ID"
      - name: Build node image
        id: node
        if: matrix.distro == '' && matrix.type == ''
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.NODE }}
          platforms: linux/${{ env.ARCH }}
          load: true
          tags: kooldev/php:${{ env.NODE }}
      - name: Test node image
        if: matrix.distro == '' && matrix.type == ''
        env:
          IMAGE_ID: ${{ steps.node.outputs.imageid }}
          BASE_ID: ${{ steps.base.outputs.imageid }}
        run: |
          python3 scripts/check_parent.py "$BASE" "$BASE_ID" "$IMAGE_ID"
          bash scripts/test-image.sh "$NODE" "$IMAGE_ID"
      # No registry credentials, staging pushes or release artifacts on PRs,
      # forks or manually dispatched feature branches.
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-php'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Stage tested images by immutable image ID
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-php'
        env:
          BASE_ID: ${{ steps.base.outputs.imageid }}
          NGINX_ID: ${{ steps.nginx.outputs.imageid }}
          NODE_ID: ${{ steps.node.outputs.imageid }}
        run: |
          python3 scripts/promote.py stage "$BASE" "$ARCH" "$BASE_ID"
          python3 scripts/promote.py stage "$NGINX" "$ARCH" "$NGINX_ID"
          if [ -n "$NODE_ID" ]; then
            python3 scripts/promote.py stage "$NODE" "$ARCH" "$NODE_ID"
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-php'
        with:
          name: php-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.BASE }}-${{ env.ARCH }}
          path: release-metadata/*.json
          if-no-files-found: error

  publish:
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-php'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: php-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: release-metadata
      # Validate the entire release before even logging into the registry.
      - name: Validate all 28 tags and both architectures
        run: python3 scripts/promote.py validate
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish manifests only (no rebuild)
        run: python3 scripts/promote.py publish

  trigger-downstream:
    needs: publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-php'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - kool-dev/docker-wordpress
          - kool-dev/docker-php-sqlsrv
          - kool-dev/docker-php-swoole
    steps:
      - name: Check downstream credentials
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.WORKFLOW_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Downstream builds cannot be triggered: configure DISPATCH_TOKEN or WORKFLOW_TOKEN with access to the downstream repositories."
            exit 1
          fi
      - name: Trigger ${{ matrix.repo }}
        id: dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DISPATCH_TOKEN || secrets.WORKFLOW_TOKEN }}
          repository: ${{ matrix.repo }}
          event-type: docker-php-updated
      - name: Record dispatch outcome
        if: always()
        env:
          REPOSITORY: ${{ matrix.repo }}
          OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          echo "- \`$REPOSITORY\`: docker-php-updated dispatch **$OUTCOME** (delivery is not downstream build completion)." >> "$GITHUB_STEP_SUMMARY"
