name: Resume publication

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Latest CI/CD run with every native build/test/staging job successful
        required: true
        type: string
      source_attempt:
        description: Completed attempt containing the complete release metadata
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Same lock as CI/CD: recovery must not interleave with a normal release.
concurrency:
  group: CI/CD-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-php'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Authorize the complete source attempt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
          SOURCE_ATTEMPT: ${{ inputs.source_attempt }}
        run: python3 scripts/recover.py "$SOURCE_RUN" "$SOURCE_ATTEMPT"
      - uses: actions/download-artifact@v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          pattern: php-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}-*
          path: release-metadata
      - name: Validate complete source metadata
        run: |
          GITHUB_RUN_ID="$SOURCE_RUN_ID" GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" python3 scripts/promote.py validate
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Republish all manifests from tested digests (no builds or staging)
        run: |
          GITHUB_RUN_ID="$SOURCE_RUN_ID" GITHUB_RUN_ATTEMPT="$SOURCE_RUN_ATTEMPT" python3 scripts/promote.py publish

  trigger-downstream:
    needs: publish
    if: github.ref == 'refs/heads/master' && github.repository == 'kool-dev/docker-php'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        repo:
          - kool-dev/docker-wordpress
          - kool-dev/docker-php-sqlsrv
          - kool-dev/docker-php-swoole
    steps:
      - name: Check downstream credentials
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN || secrets.WORKFLOW_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Configure DISPATCH_TOKEN or WORKFLOW_TOKEN for downstream dispatch."
            exit 1
          fi
      - uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.DISPATCH_TOKEN || secrets.WORKFLOW_TOKEN }}
          repository: ${{ matrix.repo }}
          event-type: docker-php-updated
