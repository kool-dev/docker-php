version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/8.*"
    schedule:
      interval: "weekly"
    groups:
      php-images:
        patterns: ["*"]
